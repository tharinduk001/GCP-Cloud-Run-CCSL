name: Build, Push & Deploy to Cloud Run

# Runs on every push to main. The deploy step uses --no-traffic + a
# revision tag, so new revisions are LIVE but receive ZERO production
# traffic until you (or a follow-up job) promote them. This is the
# blue/green pattern automated.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}   # lets you trigger it manually too

env:
  PROJECT_ID: your-gcp-project-id
  REGION: us-central1
  SERVICE: cloudrun-demo
  REPO: cloudrun-demo-repo                      # Artifact Registry repo name
  IMAGE: us-central1-docker.pkg.dev/your-gcp-project-id/cloudrun-demo-repo/cloudrun-demo

permissions:
  contents: 'read'
  id-token: 'write'   # REQUIRED for keyless Workload Identity Federation

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (Workload Identity Federation, no keys)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@your-gcp-project-id.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} \
                       -t ${{ env.IMAGE }}:latest .

      - name: Push image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy new revision WITHOUT traffic (the "green" step)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          no_traffic: true
          tag: green
          env_vars: |
            APP_COLOR=green
            APP_VERSION=${{ github.sha }}

      - name: Smoke test the green (tagged) revision
        run: |
          echo "Testing ${{ steps.deploy.outputs.url }}/health"
          curl -sf "${{ steps.deploy.outputs.url }}/health"

      - name: Promote green to 100% production traffic
        run: |
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --to-tags green=100